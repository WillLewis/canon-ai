name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -r requirements.txt -r ui/requirements.txt httpx
      - name: Run pytest
        run: python -m pytest -q
      - name: Run eval gate
        run: python eval/run_eval.py --demo
